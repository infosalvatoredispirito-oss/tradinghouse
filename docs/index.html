<!doctype html><html lang="it"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Trading House AI — Preview</title><style>
*{box-sizing:border-box}body{margin:0;background:#070b14;color:#eaf1ff;font-family:Inter,system-ui,sans-serif}button,textarea{font:inherit}.app{display:flex;height:100dvh;overflow:hidden}.side{width:275px;background:#0c1220;border-right:1px solid #20304b;padding:25px 14px;display:flex;flex-direction:column;flex-shrink:0}.logo{font-size:18px;font-weight:800;letter-spacing:1px;padding:4px 10px 32px}.logo b,.diamond{color:#67a6ff}.logo small{display:block;font-size:10px;color:#6980a4;letter-spacing:3px;margin-top:5px}.new{padding:14px;border-radius:10px;border:1px solid #365b8c;background:#182c4c;color:#eaf1ff;text-align:left;cursor:pointer}.section{color:#748baa;letter-spacing:2px;font-size:10px;font-weight:700;margin:30px 10px 12px}.agent{display:flex;gap:12px;align-items:center;background:none;border:1px solid transparent;color:#b2c0d6;width:100%;text-align:left;padding:12px;border-radius:10px;cursor:pointer}.agent.active,.agent:hover{background:#162844;border-color:#2a4d7b;color:#fff}.agent strong{font-size:13px}.agent small{display:block;font-size:11px;color:#8195b4;margin-top:4px}.foot{margin-top:auto;color:#667b9d;font-size:10px;padding:12px}.main{min-width:0;flex:1;display:flex;flex-direction:column;background:radial-gradient(ellipse at 55% 0,#132a4b 0,#090f1a 48%,#080c15 100%)}header{height:68px;border-bottom:1px solid #20304b;padding:0 26px;display:flex;align-items:center;gap:14px;font-size:14px;font-weight:700}.tag{margin-left:auto;font-size:10px;color:#7eb3ff;border:1px solid #2c507d;border-radius:6px;padding:5px 8px}.hamb{display:none;background:none;border:0;color:#fff;font-size:24px}.thread{flex:1;overflow:auto;padding:28px max(22px,calc((100% - 780px)/2))}.welcome{text-align:center;margin:7vh auto 0;max-width:650px}.mark{margin:auto;width:70px;height:70px;display:grid;place-items:center;border-radius:20px;background:#132b4c;border:1px solid #37649a;box-shadow:0 0 60px #3773c52d;font-size:35px}.over{color:#79b0ff;font-size:10px;font-weight:800;letter-spacing:2px;margin:30px 0 16px}h1{font-size:clamp(32px,4.2vw,54px);line-height:1.13;letter-spacing:-1.8px;margin:0}h1 span{color:#7baeff}.welcome p{color:#91a2bc;font-size:14px;line-height:1.7;max-width:520px;margin:22px auto 30px}.chips{display:flex;justify-content:center;flex-wrap:wrap;gap:10px}.chips button{background:#13243a;border:1px solid #304969;color:#d3e1f5;border-radius:10px;padding:12px;cursor:pointer;font-size:12px}.message{display:flex;gap:12px;margin-bottom:25px;line-height:1.65;font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere}.avatar{background:#17345a;color:#8ebfff;border-radius:10px;width:34px;height:34px;flex-shrink:0;display:grid;place-items:center;font-size:12px;font-weight:800}.message img{display:block;max-width:min(100%,400px);border-radius:10px;margin-bottom:10px}.composerWrap{padding:10px max(20px,calc((100% - 780px)/2)) 20px}.composer{display:flex;gap:10px;align-items:end;background:#111d30;border:1px solid #2d4666;padding:12px;border-radius:16px}.composer textarea{flex:1;min-width:0;background:none;border:0;outline:0;color:#fff;resize:none;padding:10px 0;max-height:120px}.upload{font-size:26px;color:#92b5e6;cursor:pointer;padding:4px}.send{background:#347fe6;color:white;border:0;border-radius:10px;width:40px;height:40px;font-size:25px;cursor:pointer}.note{text-align:center;font-size:10px;color:#647995;margin:10px 0 0}.preview{height:65px;max-width:100%;margin-bottom:8px;border-radius:8px}.veil{display:none}@media(max-width:720px){.side{position:absolute;z-index:3;inset:0 auto 0 0;transform:translateX(-105%);transition:.2s;max-width:85vw}.side.open{transform:translateX(0)}.veil.open{display:block;position:absolute;inset:0;background:#0009;z-index:2}.hamb{display:block}header{padding:0 16px;height:60px}.thread{padding:20px 15px}.welcome{margin:6vh auto 0}.welcome h1{letter-spacing:-1px}.composerWrap{padding:10px 12px 16px}.note{font-size:9px}}
</style></head><body><div class="app"><aside class="side" id="side"><div class="logo"><span class="diamond">◆</span> TRADING <b>HOUSE</b><small>AI WORKSPACE</small></div><button class="new" id="new">＋ Nuova conversazione</button><div class="section">AGENTI INTELLIGENTI</div><div id="agents"></div><div class="foot">TRADING HOUSE AI · PREVIEW</div></aside><div class="veil" id="veil"></div><main class="main"><header><button class="hamb" id="hamb">☰</button><span><span class="diamond">✦</span> <span id="current">Trading House AI</span></span><span class="tag">DEMO</span></header><div class="thread" id="thread"></div><div class="composerWrap"><img id="preview" class="preview" hidden><div class="composer"><label class="upload">＋<input id="file" type="file" accept="image/*" hidden></label><textarea id="draft" rows="1" placeholder="Chiedi al tuo agente AI…"></textarea><button class="send" id="send">↑</button></div><p class="note">Anteprima GitHub Pages · Risposte AI non ancora collegate · Nessun dato realtime</p></div></main></div><script>
const agents=[['general','Trading House AI','Assistente generale'],['market','Market Analyst','Trend e livelli'],['profit','Massimo Profitto AI','Opportunità e R/R'],['risk','Check Risk AI','Gestione rischio'],['setup','Setup Hunter','Setup condizionati'],['news','News Agent','Notizie e volatilità'],['journal','Trading Journal','Revisione operazioni']];
let selected='general',history={},attachment=null;
const $=id=>document.getElementById(id);
function closeMenu(){$('side').classList.remove('open');$('veil').classList.remove('open')}
function renderAgents(){$('agents').innerHTML='';for(const [id,name,description] of agents){const b=document.createElement('button');b.className='agent '+(id===selected?'active':'');b.innerHTML='<span class="diamond">✦</span><span><strong></strong><small></small></span>';b.querySelector('strong').textContent=name;b.querySelector('small').textContent=description;b.onclick=()=>{selected=id;$('current').textContent=name;renderAgents();render();closeMenu()};$('agents').appendChild(b)}}
function render(){$('thread').innerHTML='';const msgs=history[selected]||[];if(!msgs.length){const w=document.createElement('section');w.className='welcome';w.innerHTML='<div class="mark diamond">◆</div><div class="over">INTELLIGENCE FOR TRADERS</div><h1>Il mercato cambia.<br><span>La tua analisi evolve.</span></h1><p>Esplora la piattaforma, seleziona un agente e prova l’interfaccia. Il collegamento OpenAI sarà attivato nel backend.</p><div class="chips"></div>';for(const t of ['Analizza trend e struttura','Trova supporti e resistenze','Valuta un setup con rischio']){const b=document.createElement('button');b.textContent=t+' ↗';b.onclick=()=>{$('draft').value=t;$('draft').focus()};w.querySelector('.chips').appendChild(b)}$('thread').appendChild(w)}for(const m of msgs){const e=document.createElement('div');e.className='message';const av=document.createElement('div');av.className='avatar';av.textContent=m.role==='user'?'TU':'◆';const body=document.createElement('div');if(m.image){const im=document.createElement('img');im.src=m.image;body.appendChild(im)}const t=document.createElement('div');t.textContent=m.text;body.appendChild(t);e.append(av,body);$('thread').appendChild(e)}$('thread').scrollTop=$('thread').scrollHeight}
function send(){const t=$('draft').value.trim();if(!t&&!attachment)return;history[selected]??=[];history[selected].push({role:'user',text:t,image:attachment});history[selected].push({role:'assistant',text:'Questa è una demo navigabile su GitHub Pages. La risposta AI sarà disponibile quando collegheremo il backend OpenAI su un hosting serverless. Non inserire qui dati sensibili.'});$('draft').value='';attachment=null;$('preview').hidden=true;render()}
$('send').onclick=send;$('draft').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}};$('new').onclick=()=>{history[selected]=[];render();closeMenu()};$('hamb').onclick=()=>{$('side').classList.toggle('open');$('veil').classList.toggle('open')};$('veil').onclick=closeMenu;$('file').onchange=e=>{const f=e.target.files[0];if(!f||!f.type.startsWith('image/'))return;const r=new FileReader();r.onload=()=>{attachment=r.result;$('preview').src=attachment;$('preview').hidden=false};r.readAsDataURL(f)};renderAgents();render();
</script></body></html>
